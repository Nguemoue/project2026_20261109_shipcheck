name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Run Shipcheck tests
        run: php tests/run.php
      - name: Shipcheck stays clean on itself
        run: php shipcheck.php --strict .
